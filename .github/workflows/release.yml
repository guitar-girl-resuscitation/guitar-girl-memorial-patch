name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      server_tag:
        description: Server release to resolve to an immutable asset and commit
        default: nightly
        required: true
permissions:
  contents: read
concurrency:
  group: patch-release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Audit source, history and resource-free tests
        run: |
          python tools/release_guard.py --history
          python -m unittest discover -s tests -v
          python tools/verify_policy.py policy/memorial-policy.v1.json
      - name: Java presentation and localization tests
        run: |
          mkdir -p build/java-tests
          javac -J-Xmx256m --release 8 -encoding UTF-8 -d build/java-tests bootstrap/src/main/java/org/guitargirlresuscitation/memorial/{TerminalText,SaveTransferText,CurrencyText,LauncherText,UpdateRules,DiagnosticText}.java bootstrap/tests/*.java
          java -Xmx128m -cp build/java-tests org.guitargirlresuscitation.memorial.TerminalTextTest
          java -Xmx128m -cp build/java-tests org.guitargirlresuscitation.memorial.CurrencyTextTest
          java -Xmx128m -cp build/java-tests org.guitargirlresuscitation.memorial.LauncherUpdateTest
      - name: Install fixed Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"'
      - name: Build authored runtime against verified Server release
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_TAG: ${{ inputs.server_tag || 'nightly' }}
        run: python tools/build_runtime.py --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --server-tag "$SERVER_TAG"
      - name: Package only original runtime and licensed dependency
        run: python tools/release_artifacts.py pack --kind patch-android-arm64 --file classes.dex=build/release-runtime/classes.dex --file libggfm_bootstrap.so=build/release-runtime/libggfm_bootstrap.so --file libdobby.so=build/release-runtime/libdobby.so --file libggfm_server.so=build/release-runtime/libggfm_server.so --file THIRD_PARTY_TERMINAL_FONT.md=build/release-runtime/THIRD_PARTY_TERMINAL_FONT.md --file memorial-policy.v1.json=policy/memorial-policy.v1.json --file DOBBY-LICENSE=build/release-runtime/DOBBY-LICENSE --file dependencies.json=build/release-runtime/dependencies.json
      - name: Build ARMv7 runtime sequentially
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_TAG: ${{ inputs.server_tag || 'nightly' }}
        run: python tools/build_runtime.py --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --server-tag "$SERVER_TAG" --abi armeabi-v7a --output build/release-runtime-armv7
      - name: Package ARMv7 runtime separately
        run: python tools/release_artifacts.py pack --kind patch-android-armv7 --file classes.dex=build/release-runtime-armv7/classes.dex --file libggfm_bootstrap.so=build/release-runtime-armv7/libggfm_bootstrap.so --file libdobby.so=build/release-runtime-armv7/libdobby.so --file libggfm_server.so=build/release-runtime-armv7/libggfm_server.so --file THIRD_PARTY_TERMINAL_FONT.md=build/release-runtime-armv7/THIRD_PARTY_TERMINAL_FONT.md --file memorial-policy.v1.json=policy/memorial-policy.v1.json --file DOBBY-LICENSE=build/release-runtime-armv7/DOBBY-LICENSE --file dependencies.json=build/release-runtime-armv7/dependencies.json
      - uses: actions/upload-artifact@v4
        with:
          name: patch-release
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: patch-release
          path: dist
      - name: Publish only verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
        run: python tools/release_artifacts.py publish --tag "$RELEASE_TAG"
